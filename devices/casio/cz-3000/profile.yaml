name: Casio CZ-3000
manufacturer: Casio Computer Co., Ltd.
category: Professional 16-DCO Phase Distortion Synthesizer with Stereo Chorus
release_year: 1986
hardware:
  form_factor: "61-Key Synthesizer Keyboard"
  polyphony: "8 voices (1-Line mode), 8 voices (2-Line mode with 16 DCOs)"
  oscillators: "16 Phase Distortion DCOs (Dual Lines: Line 1 & Line 2)"
  waveforms: "8 basic waveforms (Sawtooth, Square, Pulse 1-3, Double Sine, Saw-Pulse, Resonance 1-3)"
  filters: "2 Digital Controlled Wave (DCW) filter shapers with 8-stage rate/level envelopes"
  amplifiers: "2 Digital Controlled Amplifier (DCA) units with 8-stage rate/level envelopes"
  modulation: "Ring Modulator (Line 1 x Line 2), Noise Modulation, Vibrato (Triangle, Saw Up, Saw Down, Square)"
  keyboard: "61 full-sized keys with pitch bend wheel, modulation wheel, portamento, and solo mode"
  effects: "Built-in Stereo Analog BBD Chorus unit with 3 presets"
  memory: "64 ROM Factory Presets, 64 RAM Internal Memory slots, Cartridge port (RC-10/20)"
  chassis: "Dark anthracite metal chassis with tactile pushbuttons, red and blue LED indicators, high-contrast backlit 2x16 LCD display"
midi:
  manufacturer_id:
  - 68
  model_id: 5
  default_device_id: 0
  bank_select:
    msb_cc: 0
    msb_val: 0
    lsb_cc: 32
    banks:
      0: "Preset Bank A (Brass & Reeds)"
      1: "Preset Bank B (Strings, Guitars & Bass)"
      2: "Preset Bank C (Pianos, Organs & Mallets)"
      3: "Preset Bank D (Synth & Sound Effects)"
sysex:
  header:
  - 240
  - 68
  - 0
  - 0
  - 112
  commands:
    parameter_edit: 64
    tone_dump_request: 4
    tone_dump: 70
  parameter_edit_format: "F0 44 00 00 70 <dev_id> <param_id> <val_byte> F7"
ui_theme:
