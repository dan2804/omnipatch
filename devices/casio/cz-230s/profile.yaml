name: Casio CZ-230S
manufacturer: Casio Computer Co., Ltd.
category: Phase Distortion Synthesizer & PCM Rhythm Workstation
release_year: 1986
hardware:
  form_factor: "49 Mini-Key Synthesizer with Built-in Monitor Speakers"
  polyphony: "8 voices (Phase Distortion) + PCM RZ-1 Rhythm Section"
  oscillators: "Phase Distortion DCO Engine + 12-Voice PCM Drum Voices"
  rhythm: "20 Preset PCM Rhythms with Synchro Start, Fill-in, and 10 User Rhythm Memories"
  amplifiers: "Stereo Built-in Amplifiers with twin front-facing speaker grilles"
  memory: "99 Factory Preset Tones, 4 Programmable RAM Memories (P1-P4), 20 PCM Rhythms"
  chassis: "Sleek light silver-grey console chassis with dual speaker grilles, high-visibility green numeric/segment LCD, red rhythm control pads, and tempo controls"
midi:
  manufacturer_id:
  - 68
  model_id: 4
  default_device_id: 0
  bank_select:
    msb_cc: 0
    msb_val: 0
    lsb_cc: 32
    banks:
      0: "Preset Tones (00-99)"
      1: "User RAM Tones (P1-P4)"
sysex:
  header:
  - 240
  - 68
  - 0
  - 0
  - 112
  commands:
    parameter_edit: 64
    tone_dump_request: 4
    tone_dump: 70
  parameter_edit_format: "F0 44 00 00 70 <dev_id> <param_id> <val_byte> F7"
ui_theme:
  style: hardware_chassis
  chassis_color: '#cfd2d6'
  panel_color: '#1e2024'
  chassis_type: silver_grey_cz230s_drum_synth
  accent_color: '#ef4444'
  buttons: tactile_pads
