  chassis_color: '#1a1c20'
  panel_color: '#141518'
  chassis_type: black_cz101_mini_keyboard
  accent_color: '#00a2e8'
  buttons: tri_color_membrane
  button_blue: '#00a2e8'
  button_yellow: '#facc15'
  button_red: '#ef4444'
  lcd_backlight: '#064e3b'
  lcd_text: '#34d399'
