name: Casio CZ-101
manufacturer: Casio Computer Co., Ltd.
category: Portable 4/8-Voice Phase Distortion Mini-Key Synthesizer
release_year: 1984
hardware:
  form_factor: "49 Mini-Keys Shoulder/Keytar Synthesizer"
  polyphony: "8 voices (1-Line mode), 4 voices (2-Line mode)"
  oscillators: "8 Phase Distortion DCOs (Dual Lines: Line 1 & Line 2)"
  waveforms: "8 basic waveforms (Sawtooth, Square, Pulse 1-3, Double Sine, Saw-Pulse, Resonance 1-3)"
  filters: "2 Digital Controlled Wave (DCW) filter shapers with 8-stage rate/level envelopes"
  amplifiers: "2 Digital Controlled Amplifier (DCA) units with 8-stage rate/level envelopes"
  modulation: "Ring Modulator (Line 1 x Line 2), Noise Modulation, Vibrato (Triangle, Saw Up, Saw Down, Square)"
  keyboard: "49 mini-keys with pitch bend wheel, portamento, solo mode, and dual guitar strap pegs"
  memory: "16 ROM Factory Presets, 16 RAM Internal Memory slots, Cartridge port (RC-10/20)"
  chassis: "Iconic compact matte black chassis with guitar strap pegs, colorful membrane buttons in Casio blue, yellow, and red, high-contrast 2x16 LCD display"
midi:
  manufacturer_id:
  - 68
  model_id: 1
  default_device_id: 0
  bank_select:
    msb_cc: 0
    msb_val: 0
    lsb_cc: 32
    banks:
      0: "Preset ROM (Factory Sounds 1-16)"
      1: "Internal RAM (User Sounds 1-16)"
sysex:
  header:
  - 240
  - 68
  - 0
  - 0
  - 112
  commands:
    parameter_edit: 64
    tone_dump_request: 4
    tone_dump: 70
  parameter_edit_format: "F0 44 00 00 70 <dev_id> <param_id> <val_byte> F7"
ui_theme:
