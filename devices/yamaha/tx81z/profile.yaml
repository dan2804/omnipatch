schema_version: 1.0.0
manufacturer: Yamaha Corporation
name: Yamaha TX81Z
family: TX Series
category: 4-Operator Multi-Waveform FM Rack
year: 1987
voice_architecture:
  voices: 8
  parts: 8
  operators: 4
  algorithms: 8
  waveforms: 8 selectable oscillator waveforms per operator (W1 Sine through W8 non-sine
    harmonics)
  microtuning: 13 microtuning scales + 2 user microtunings
  effects: Built-in MIDI pseudo-delay and pan effects
  famous_patches: 'LatelyBass (Preset Bank A #13), SolidBass'
midi_specs:
  basic_channel: 1
  manufacturer_id: '0x43'
  sub_status: '0x00'
  model_id: '0x7E'
