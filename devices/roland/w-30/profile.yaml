  - 127
  default: 105
- id: tvf_resonance
  name: TVF Filter Resonance
  page: Filter
  range:
  - 0
  - 127
  default: 20
- id: tva_level
  name: TVA Level
  page: Amp
  range:
  - 0
  - 127
  default: 100
- id: tva_attack
  name: TVA Attack Time
  page: Amp
  range:
