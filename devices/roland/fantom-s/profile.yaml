  polyphony: 64 Voices
  parts: 16 Multi-Timbral Parts
  rom: 64MB Wave ROM (expandable via 4x SRX slots)
  pads: 16 Velocity-Sensitive Dynamic Pads
  sampling: Skip-Back Sampling, up to 288MB RAM
