  range:
  - 1
  - 8
  default: 1
- id: reverb_level
  name: Reverb Level
  page: Effects
  range:
  - 0
  - 7
  default: 4
- id: part1_level
  name: Part 1 Level
  page: Multi
  range:
  - 0
  - 100
  default: 100
- id: part1_pan
  name: Part 1 Pan
  page: Multi
  range:
  - -7
  - 7
  default: 0
- id: tvf_cutoff
  name: TVF Cutoff Frequency
  page: Filter
  range:
