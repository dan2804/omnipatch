name: Roland D-50
manufacturer: Roland Corporation
category: 16-Voice Linear Arithmetic Synthesizer
release_year: 1987
hardware:
  form_factor: 61-Key Performance Synthesizer (D-550 is 2U Rack)
  polyphony: 16 Voices
  voice_architecture: 'Linear Arithmetic (LA) Synthesis: 2 Tones (Upper/Lower), 4
    Partials per patch (Synth waveform or PCM attack/loop) with Ring Modulation'
  effects: Built-in Digital Reverb (32 modes) + Digital Chorus (8 modes) + 2-Band
    Parametric EQ
midi:
  manufacturer_id: '0x41'
  device_id: 16
  model_id: '0x14'
  channel: 1
sysex:
  header: F0 41 {device_id} 14 {command_id} {address} {data} {checksum} F7
  checksum: roland
  command_ids:
    dataset_dt1: '0x12'
    request_rq1: '0x11'
  parameter_edit_format: F0 41 10 14 12 {address} {value} {checksum} F7
