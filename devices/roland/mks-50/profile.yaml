  engine: Alpha Juno DCO Engine with Chord Memory and PG-300 programmer support
  filter_type: Roland IR3109 24dB Resonant Lowpass VCF + HPF
  famous_patches: What The... (Hoover sound), Alpha Strings, Sub Bass
midi_specs:
