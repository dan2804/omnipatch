name: Roland JP-8080
manufacturer: Roland Corporation
category: 10-Voice Virtual Analog Rack Synthesizer with Vocoder
release_year: 1998
hardware:
  form_factor: 6U Rackmount Synthesizer
  polyphony: 10 Voices
  engine: Analog Modeling (DSP) featuring the historic Super Saw waveform, Triangle
    Mod, Noise, Feedback Osc
  effects: Multi-mode VCF (-12dB / -24dB), Chorus/Flanger, Delay, Tone Control
  vocoder: 12-Band Built-in Vocoder & Voice Modulator with Mic Input
