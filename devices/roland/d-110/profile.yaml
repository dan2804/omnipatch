  polyphony: 32 Voices
  parts: 8 Multi Parts + 1 Rhythm Part
  outputs: 8 Individual Analog Multi-Outputs + Stereo Mix
  synthesis: Linear Arithmetic (LA) Synthesis (PCM attacks + Synth sustain partials)
midi:
