schema_version: 1.0.0
manufacturer: Roland Corporation
name: Roland JX-305
family: Groove Series
category: Groove Synthesizer Workstation
year: 1998
voice_architecture:
  voices: 64
  parts: 8
  keyboard: 61 keys with velocity and channel aftertouch
  sound_engine: MC-505 Groovebox Sound Engine (640 Patches + 26 Rhythm Sets)
  sequencer: Realtime Pattern Sequencer with 714 preset patterns + RPS
  controller: D-Beam Controller & Realtime Control Knobs (Cutoff, Reso, LFO, Env)
  effects: Multi-effects (24 types) + Delay + Reverb + Compressor
midi_specs:
  basic_channel: 1
  model_id: 0x00 0x14
  sysex_id: '0x41'
  handshake: false
  pacing_delay_ms: 20
parameters:
- id: vcf_cutoff
  name: Realtime Cutoff
  type: range
  min: 0
  max: 127
  default: 64
- id: vcf_resonance
  name: Realtime Resonance
  type: range
  min: 0
  max: 127
  default: 32
- id: env_attack
  name: Realtime Attack Time
  type: range
  min: 0
  max: 127
  default: 64
- id: env_decay
  name: Realtime Decay/Release
  type: range
  min: 0
  max: 127
  default: 64
- id: lfo_rate
  name: LFO Rate
  type: range
  min: 0
  max: 127
  default: 50
- id: d_beam_assign
  name: D-Beam Controller Assign
  type: enum
  options:
  - Pitch Bend
  - Cutoff
  - Ad Lib
  - Turntable Brake
  - FX Mod
  default: Cutoff
- id: mfx_type
  name: Multi-Effects Type
  type: enum
  options:
  - Stereo EQ
  - Overdrive
  - Distortion
  - Phaser
  - Spectrum
  - Auto Wah
  - Rotary
  - Compressor
  - Hexa-Chorus
  - Tremolo
  default: Stereo EQ
- id: reverb_send
  name: Reverb Send Level
  type: range
  min: 0
  max: 127
  default: 40
