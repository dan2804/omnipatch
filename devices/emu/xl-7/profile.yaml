name: E-MU XL-7
manufacturer: E-mu Systems, Inc.
category: 128-Voice Desktop Workstation & Command Station
release_year: 2001
hardware:
  form_factor: Desktop Command Station Workstation Console with Slanted Front Panel
  polyphony: 128
  multitimbral_parts: 32
  sound_memory: 32 MB X-Lead Sound ROM (Expandable up to 128 MB via 4 72-pin SIMM
    sockets)
  filter: 50 2nd to 12th order Z-Plane morphing resonant filters with parametric formant
    interpolation
  sequencer: 16-track multitrack pattern/song sequencer (384 PPQN resolution, 1024
    patterns, 512 songs, Realtime/Grid/Step record)
  pads: 16 dynamic velocity- and pressure-sensitive trigger pads with polyphonic aftertouch
  knobs: 16 continuous rotary controller knobs (multi-layer Quick-Edit A-D, E-H, I-L,
    M-P)
  tracks: 16 dedicated Track Enable/Mute buttons with LED activity indicators
  transport: 'Dedicated hardware transport buttons: Rewind, Fast-Forward, Stop/Pause,
    Play, Record, Tap Tempo'
  display: 2 x 24 character high-contrast alphanumeric backlit LCD display
  lamp: 12V BNC gooseneck lamp socket for dark studio/stage environments
  audio_outputs: 6 polyphonic analog outputs (Main, Sub 1, Sub 2) + Coaxial S/PDIF
    stereo digital out (AES-pro)
  audio_inputs: 4 submix analog inputs (summed directly to main output mix)
  midi_io: MIDI In, (2) independent MIDI Out ports (32 MIDI channels)
midi:
  manufacturer_id:
  - 24
  product_id: 15
  model_id: 14
  default_device_id: 0
  timing_resolution_ppqn: 384
  bank_select:
    msb_cc: 0
    msb_val: 0
    lsb_cc: 32
    banks:
      0: User Bank 0 / XL-7 Bank 0 (Kits, Percussion & Hits)
      1: User Bank 1 / XL-7 Bank 1 (Synths, Leads & Pads)
      2: User Bank 2 / XL-7 Bank 2 (Basses, Edges, Walls & FX)
      3: User Bank 3 / XL-7 Bank 3 (Arps, BPM Clocks, Air & Vocals)
sysex:
  header:
  - 240
  - 24
  - 15
  - '{device_id}'
  special_editor_byte: 85
  commands:
    parameter_edit: 1
    generic_editor_message: 85
  parameter_edit_format: F0 18 0F <dev_id> 55 01 02 <param_lsb> <param_msb> <val_lsb>
    <val_msb> F7
ui_theme:
  style: desktop_command_station
  background_color: '#160728'
  accent_purple: '#9333ea'
  accent_yellow: '#eab308'
  accent_lime: '#84cc16'
  accent_cyan: '#06b6d4'
  lcd_backlight: '#08282f'
  lcd_text: '#00f0ff'
  pad_color: '#2a1245'
  pad_glow: '#c084fc'
  knob_style: command_station_rotary
parameters:
- id: filter_cutoff
  name: Filter Cutoff / Morph (Knob 1 / A)
  page: filter
  param_id: 384
  type: linear
  range:
  - 0
  - 255
  default: 190
  unit: steps
- id: filter_q
  name: Filter Q / Resonance (Knob 2 / B)
  page: filter
  param_id: 385
  type: linear
  range:
  - 0
  - 255
  default: 90
  unit: steps
- id: filter_type
  name: Z-Plane Filter Model (50 Types)
  page: filter
  param_id: 387
  type: enum
  range:
  - 0
  - 49
  default: 12
  options:
    0: 12-Pole Swept Lowpass
    1: Acid TB-303 Lowpass Q
    2: Dual Peak Vocal Formant A-E-I-O-U
    3: Techno Highpass 24dB
    4: Bandpass Swept Morph
    5: Resonant Comb Flange
    12: Extreme Lead 12-Pole Z-Plane
    16: Phazer Morph 8-Stage
    20: Vocal Ah-Oh Formant
    25: Distorted Lowpass 18dB
    30: Notch Shift Morph
    49: Bottom End Sub Boost
