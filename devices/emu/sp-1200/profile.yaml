name: E-MU SP-1200
manufacturer: E-mu Systems, Inc.
category: 12-Bit Sampling Drum Machine & Sequencer (SSM2044 Analog Filters)
release_year: 1985
hardware:
  form_factor: Desktop Drum Machine / Sampling Workstation Console
  polyphony: 8
  sampling_spec: 12-bit linear at 26.040 kHz sampling frequency
  sampling_time: 10.0 seconds total (4 sample banks A, B, C, D of 2.5 seconds each)
  filters: SSM2044 24dB/oct resonant analog dynamic low-pass filters on Channels 1-2, static SSM filters on Channels 3-6, full-range on Channels 7-8
  pads: 8 velocity-sensitive dynamic rubber drum pads (A/B/C/D bank select for 32 total sound slots)
  faders: 8 multi-function smooth-travel hardware sliders for real-time Tuning, Decay, Mix Level, and Dynamic Panning
  sequencer: 100 Segments (patterns), 100 Songs, SMPTE time code synchronization, 24 PPQN internal clock
  storage: 3.5-inch 2DD Floppy Disk Drive
  outputs: 8 polyphonic individual mono voice outputs + Stereo Main Left/Right Mix
  chassis: Classic E-mu taupe/grey chassis with iconic royal blue accent striping, black/grey tactile performance pads, and illuminated LCD
midi:
  manufacturer_id:
  - 24
  product_id: 3
  model_id: 1
  default_device_id: 0
  pad_mapping:
    bank_a: [36, 38, 42, 46, 41, 45, 48, 51]
    bank_b: [37, 39, 44, 49, 43, 47, 50, 52]
    bank_c: [53, 54, 55, 56, 57, 58, 59, 60]
    bank_d: [61, 62, 63, 64, 65, 66, 67, 68]
sysex:
  header:
  - 240
  - 24
  - 3
  - '{device_id}'
  commands:
    parameter_edit: 1
    sample_dump_standard: 64
    sequence_data_dump: 65
  parameter_edit_format: F0 18 03 <dev_id> 01 <param_lsb> <param_msb> <val_lsb> <val_msb> F7
ui_theme:
  style: desktop_sampler_drum_machine
  chassis_color: '#8e8d85'
  panel_color: '#787770'
  accent_color: '#2563eb'
  stripe_color: '#1d4ed8'
  chassis_type: classic_emu_blue_grey
  pads: tactile_grey_rubber
  pad_color: '#27272a'
  slider_caps: vintage_silver_black
  lcd_backlight: '#064e3b'
  lcd_text: '#6ee7b7'
