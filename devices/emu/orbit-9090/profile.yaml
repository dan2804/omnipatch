name: E-MU Orbit 9090
manufacturer: E-mu Systems, Inc.
category: 32-Voice Dance / Techno Sound Module (The Original 1996 Dance Planet 1U Rack)
release_year: 1996
hardware:
  form_factor: 1U 19-inch Rackmount
  polyphony: 32
  multitimbral_parts: 16
  sound_memory: 8 MB Dance & Techno Sound ROM (512 presets featuring 909, 808, 303, Juno & rave stabs)
  filter: Dynamic lowpass resonant digital filters with real-time modulation & Beats mode
  effects: Integrated dual stereo chorus & delay processor
  outputs: "6 polyphonic outputs (3 stereo pairs: Main, Sub 1, Sub 2)"
  chassis: Vibrant golden yellow 1990s 1U faceplate with black buttons, data wheel, and retro 2x16 green backlit LCD display
midi:
  manufacturer_id:
  - 24
  product_id: 5
  model_id: 1
  default_device_id: 0
  bank_select:
    msb_cc: 0
    msb_val: 0
    lsb_cc: 32
    banks:
      0: Bank 0 (RAM User Presets 0-127)
      1: Bank 1 (RAM User Presets 128-255)
      2: Bank 2 (ROM Factory Dance Presets 256-383)
      3: Bank 3 (ROM Factory Techno & Rave Presets 384-511)
sysex:
  header:
  - 240
  - 24
  - 5
  - '{device_id}'
  special_editor_byte: 1
  commands:
