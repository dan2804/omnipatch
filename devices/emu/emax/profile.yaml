name: E-MU Emax
manufacturer: E-mu Systems, Inc.
category: 12-Bit Sampling Synthesizer (SSM2047 Analog 24dB/oct Filters)
release_year: 1986
hardware:
  architecture: 12-bit linear companded digital sampling into true SSM2047 analog
    4-pole low-pass filters per voice
  polyphony: 16
  sample_rates:
  - 10.000 kHz
  - 14.286 kHz
  - 17.857 kHz
  - 20.833 kHz
  - 27.778 kHz
  - 31.250 kHz
  - 39.062 kHz
  filter: SSM2047 24dB/oct 4-pole resonant low-pass filter with AHDSR envelope and
    key tracking
  vca: Analog VCA with AHDSR envelope and velocity sensitivity
  lfo: Triangle/sine LFO with initial rate, delay, and variation
  chorus: True analog BBD stereo chorus / doubling circuit
  chassis: Charcoal matte grey with ice-blue typography and 2x16 alphanumeric backlit
    LCD
midi:
  manufacturer_id:
  - 24
  device_id: 0
  product_id: 2
  channel: 1
  sample_dump_standard: true
  supermode: Polyphonic multi-timbral reception across 16 channels
  pitch_bend: true
  aftertouch: true
sysex:
  header:
  - 240
  - 24
  - 2
  - '{device_id}'
  commands:
    parameter_edit: 1
    voice_data_request: 2
    voice_data_dump: 3
    preset_data_request: 4
    preset_data_dump: 5
    sample_dump_header: 6
    sample_dump_data: 7
  parameter_edit_format:
    header:
    - 240
    - 24
    - 2
    - '{device_id}'
    - 1
    - '{param_id}'
    - '{val_lsb}'
    - '{val_msb}'
    - 247
ui_theme:
  style: hardware_chassis
  background_color: '#121417'
  accent_cyan: '#00d2ff'
  accent_gold: '#eab308'
  lcd_backlight: '#082a32'
  lcd_text: '#00f0ff'
  slider_cap: '#262b32'
parameters:
- id: vcf_cutoff
  name: Filter Cutoff (Fc)
  page: analog_processing
  param_id: 130
  type: linear
  range:
  - 0
  - 127
  default: 95
  unit: steps
- id: vcf_resonance
  name: Filter Resonance (Q)
  page: analog_processing
  param_id: 131
  type: linear
  range:
