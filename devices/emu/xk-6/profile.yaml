name: E-MU XK-6
manufacturer: E-mu Systems, Inc.
category: 61-Key Dance Performance Synthesizer (64-Voice, 50 Z-Plane Filters & SuperBEATS)
release_year: 2001
hardware:
  form_factor: 61-Key Performance Keyboard
  polyphony: 64
  multitimbral_parts: 16
  sound_memory: 32 MB 'X-Lead' Sound ROM (Cutting-edge synth leads, acid basses, punchy drums, rave hits)
  filter: 50 12-pole Z-Plane morphing resonant filters
  beats_engine: 16-track SuperBEATS interactive loop sequencer with real-time X-Factor groove crossfade
  arpeggiator: 16 simultaneous synchronized polyphonic arpeggiator engines
  knobs: 4 real-time multi-function knobs (12 virtual controllers via 3 layer modes)
  keys: 61 synth-action keys with velocity and channel aftertouch
  controllers: 'Pitch and Mod Wheels, 4 Real-time Knobs, Footswitch input'
  outputs: '4 polyphonic outputs (2 stereo pairs: Main L/R, Sub L/R)'
  chassis: Grey keyboard chassis with electric yellow background control section and black tactile buttons
midi:
  manufacturer_id:
  - 24
  product_id: 15
  model_id: 18
  default_device_id: 0
  bank_select:
    msb_cc: 0
    msb_val: 0
    lsb_cc: 32
    banks:
      0: User Bank 0 / XLEAD Bank 0
      1: User Bank 1 / XLEAD Bank 1
      2: User Bank 2 / XLEAD Bank 2
      3: User Bank 3 / XLEAD Bank 3
