name: E-MU Planet Phatt
manufacturer: E-mu Systems, Inc.
category: 64-Voice Hip-Hop / R&B Sound Module (Classic 1U Rack)
release_year: 1997
hardware:
  form_factor: 1U 19-inch Rackmount
  polyphony: 64
  multitimbral_parts: 16
  sound_memory: 16 MB Hip-Hop / Rap / Urban Sound ROM (over 640 presets & drum kits)
  filter: Dynamic lowpass resonant digital filters with real-time modulation & 32-pole filters
  effects: Dual 24-bit stereo multi-effects processor
  outputs: "6 polyphonic outputs (3 stereo pairs: Main, Sub 1, Sub 2)"
  chassis: Electric neon pink anodized 1U faceplate with sleek black buttons, data wheel, and retro green backlit 2x16 LCD display
midi:
  manufacturer_id:
  - 24
  product_id: 7
  model_id: 1
  default_device_id: 0
  bank_select:
    msb_cc: 0
    msb_val: 0
    lsb_cc: 32
    banks:
      0: Bank 0 (RAM User Presets 0-127)
      1: Bank 1 (RAM User Presets 128-255)
      2: Bank 2 (ROM Factory Presets 256-383)
      3: Bank 3 (ROM Factory Presets 384-511)
sysex:
