name: E-MU Carnaval
manufacturer: E-mu Systems, Inc.
category: 32-Voice Latin & World Percussion Sound Module (BEATS Engine)
release_year: 1997
hardware:
  form_factor: 1U 19-inch Rackmount
  polyphony: 32
  multitimbral_parts: 16
  sound_memory: 16 MB Latin & World Sound Set (Afro-Cuban, Brazilian, Salsa, Merengue,
    Tejano, Samba)
  outputs: "'6 Polyphonic Outputs (3 Stereo Pairs: Main, Sub 1, Sub 2 with FX Returns)'"
  engine: Dual-Layer Sample Architecture (Primary & Secondary Instruments)
  beats_mode: 100 User-Editable Drum Loops with Interactive X-Factor Groove Control
midi:
  manufacturer_id:
  - 24
  product_id: 10
  device_family:
  - 4
  - 1
  device_member:
  - 1
  - 0
  default_device_id: 0
  broadcast_device_id: 127
  bank_select:
    msb_cc: 0
    msb_val: 0
    lsb_cc: 32
    banks:
      0: Bank 0 (RAM - Traditional)
      1: Bank 1 (RAM - Traditional)
      2: Bank 2 (ROM - Synthesizer)
      3: Bank 3 (ROM - Beats)
      4: Bank 4 (ROM - Beats, Demo, Links)
sysex:
  header:
  - 240
  - 24
  - 10
  - '{device_id}'
  commands:
    preset_data_request: 0
    preset_data: 1
    parameter_value_request: 2
    parameter_value: 3
    tuning_table_request: 4
    tuning_table: 5
    instrument_list_request: 14
    preset_list_request: 18
  parameter_edit_format:
    header:
    - 240
    - 24
    - 10
    - '{device_id}'
    - 3
    - '{param_lsb}'
    - '{param_msb}'
    - '{val_lsb}'
    - '{val_msb}'
    - 247
ui_theme:
  style: carnaval_tropical_teal
  chassis_color: '#072023'
  bezel_color: '#0e3b42'
  accent_gold: '#f59e0b'
  accent_magenta: '#ec4899'
  accent_emerald: '#10b981'
  lcd_backlight: '#082b2f'
  lcd_text: '#34d399'
  led_red: '#ef4444'
  led_green: '#22c55e'
parameters:
- id: beats_status
  name: Beats Mode Status
  param_id: 10
  type: enum
  range:
  - 0
  - 2
  default: 1
  options:
    0: 'Off'
    1: Beats Active
    2: Song Play
- id: beats_pattern_select
  name: Beats Loop Pattern
  param_id: 11
  type: linear
  range:
  - 0
  - 99
  default: 2
  unit: pattern
- id: beats_tempo
  name: Beats Groove Tempo
  param_id: 12
  type: linear
  range:
  - 20
  - 300
  default: 118
  unit: BPM
- id: beats_xfactor
  name: X-Factor Groove Crossfade
  param_id: 13
  type: linear
  range:
  - 1
  - 127
  default: 64
- id: beats_transpose
  name: Beats Key Transposition
  param_id: 14
  type: bipolar
  range:
  - -24
  - 24
  default: 0
  unit: semitones
- id: beats_sync
  name: Beats Clock Sync Mode
  param_id: 15
  type: enum
  range:
  - 0
  - 1
  default: 0
  options:
    0: Internal Clock
    1: MIDI Clock Sync
- id: pri_filter_cutoff
  name: Primary Filter Cutoff
  param_id: 20
  type: linear
  range:
  - 0
  - 127
  default: 112
- id: pri_filter_q
  name: Primary Filter Resonance (Q)
  param_id: 21
  type: linear
  range:
  - 0
  - 15
  default: 4
- id: pri_filter_type
  name: Primary Filter Type
  param_id: 22
  type: enum
  range:
  - 0
  - 16
  default: 0
  options:
    0: Lowpass 4-Pole
    1: Lowpass 2-Pole
    2: Bandpass
    3: Highpass
    4: Vocal Formant
- id: sec_filter_cutoff
  name: Secondary Filter Cutoff
  param_id: 23
  type: linear
  range:
  - 0
  - 127
  default: 127
- id: sec_filter_q
  name: Secondary Filter Resonance (Q)
  param_id: 24
  type: linear
  range:
  - 0
  - 15
  default: 0
- id: pri_env_attack
  name: Primary Volume Attack
  param_id: 30
  type: linear
  range:
  - 0
  - 127
  default: 2
- id: pri_env_decay
  name: Primary Volume Decay
  param_id: 31
  type: linear
  range:
  - 0
  - 127
  default: 35
- id: pri_env_sustain
  name: Primary Volume Sustain
  param_id: 32
  type: linear
  range:
  - 0
  - 127
  default: 110
- id: pri_env_release
  name: Primary Volume Release
  param_id: 33
  type: linear
  range:
  - 0
  - 127
  default: 20
- id: crossfade_balance
  name: Primary / Secondary Balance
  param_id: 35
  type: bipolar
  range:
  - 0
  - 127
  default: 64
- id: solo_mode
  name: Solo / Poly Mode
  param_id: 36
  type: enum
  range:
  - 0
  - 2
  default: 0
  options:
    0: Poly
    1: Mono
    2: Solo
- id: lfo1_shape
  name: LFO 1 Waveform
  param_id: 40
  type: enum
  range:
  - 0
  - 4
  default: 1
  options:
    0: Triangle
    1: Sine
    2: Sawtooth
    3: Square
    4: Random
- id: lfo1_rate
  name: LFO 1 Speed
  param_id: 41
  type: linear
  range:
  - 0
  - 127
  default: 48
- id: lfo2_shape
  name: LFO 2 Waveform
  param_id: 42
  type: enum
  range:
  - 0
  - 4
  default: 0
- id: lfo2_rate
  name: LFO 2 Speed
  param_id: 43
  type: linear
  range:
  - 0
  - 127
  default: 60
- id: master_tune
  name: Master Fine Tuning
  param_id: 50
  type: bipolar
  range:
  - -64
  - 64
  default: 0
  unit: cents
- id: master_transpose
  name: Master Transpose
  param_id: 51
  type: bipolar
  range:
  - -12
  - 12
  default: 0
  unit: semitones
- id: submix_routing
  name: Output Submix Routing
  param_id: 52
  type: enum
  range:
  - 0
  - 2
  default: 0
  options:
    0: Main Stereo
    1: Submix 1
    2: Submix 2
