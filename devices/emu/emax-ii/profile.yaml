name: E-MU Emax II
manufacturer: E-mu Systems, Inc.
category: 16-Bit Stereo Digital Sampling Synthesizer & Workstation
release_year: 1989
hardware:
  architecture: 16-bit linear stereo digital sampling with 32-voice polyphony into
    digital resonant 4-pole low-pass filters
  polyphony: 32
  sample_rates:
  - 20.000 kHz
  - 22.050 kHz
  - 31.250 kHz
  - 39.000 kHz
  - 44.100 kHz (CD Quality)
  memory: Up to 8 MB Sample RAM with internal SCSI hard drive support
  filter: Digital 24dB/oct 4-pole resonant low-pass filter with AHDSR envelope and
    key tracking
  vca: Digital VCA with AHDSR dynamics and velocity sensitivity
  synthesis: Spectrum Interpolation (additive harmonic synthesis), Transform Multiplication,
    SE Sample Editing
  stack_mode: Preset Stacking (layer up to 4 presets simultaneously across the keyboard)
  chorus: Digital stereo chorus / spatial doubling processor
  chassis: Sleek black/charcoal with gold/yellow typography and yellow-green backlit
    2x16 LCD
midi:
  manufacturer_id:
  - 24
  device_id: 0
  product_id: 5
  channel: 1
  sample_dump_standard: true
  supermode: 16-channel polyphonic multitimbral sequencer/MIDI reception
  pitch_bend: true
  aftertouch: true
sysex:
  header:
  - 240
  - 24
  - 5
  - '{device_id}'
  commands:
    parameter_edit: 1
    voice_data_request: 2
    voice_data_dump: 3
    preset_data_request: 4
    preset_data_dump: 5
    sample_dump_header: 6
    sample_dump_data: 7
    spectrum_synthesis_request: 8
  parameter_edit_format:
    header:
    - 240
    - 24
    - 5
    - '{device_id}'
    - 1
    - '{param_id}'
    - '{val_lsb}'
    - '{val_msb}'
    - 247
ui_theme:
  style: hardware_chassis
  background_color: '#0d0f12'
  accent_gold: '#eab308'
  accent_cyan: '#00d2ff'
  panel_border: '#22272e'
  lcd_backlight: '#1f2605'
  lcd_text: '#e2f939'
  slider_cap: '#1c2128'
