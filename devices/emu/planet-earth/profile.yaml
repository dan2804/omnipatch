name: E-MU Planet Earth
manufacturer: E-mu Systems, Inc.
category: 64-Voice World Sound Module (32 MB World Expedition ROM & 50 Z-Plane Filters)
release_year: 2000
hardware:
  form_factor: 1U 19-inch Rackmount
  polyphony: 64
  multitimbral_parts: 32
  sound_memory: 32 MB World Expedition ROM (expandable up to 128 MB via 4 internal 72-pin SIMM slots)
  filter: 50 12-pole Z-Plane morphing resonant filters with parametric formant interpolation
  knobs: 4 real-time multi-function controller knobs with 3-row mode selection (controlling 12 virtual parameters A-L)
  outputs: "6 balanced analog outputs (3 stereo pairs: Main, Sub 1, Sub 2) + S/PDIF stereo digital out"
  midi_io: Dual independent MIDI In/Out/Thru ports (MIDI A and MIDI B, 32 channels)
  chassis: Deep ocean teal / greenish-blue anodized 1U faceplate with black knobs, tactile buttons, and luminous turquoise 2x24 LCD display
midi:
  manufacturer_id:
  - 24
  product_id: 15
  model_id: 6
  default_device_id: 0
  bank_select:
    msb_cc: 0
    msb_val: 0
    lsb_cc: 32
    banks:
      0: User Bank 0 / EARTH Bank 4 (World Strings, Plucks, Flutes & Reeds)
      1: User Bank 1 / EARTH Bank 5 (Bowed, Bells, Gongs & Tuned Percussion)
      2: User Bank 2 / EARTH Bank 6 (World Ensembles, Drones & Ethnic Sweeps)
      3: User Bank 3 / EARTH Bank 7 (Percussion Loops, Tablas, Taiko & World Kits)
sysex:
  header:
  - 240
  - 24
  - 15
  - '{device_id}'
  special_editor_byte: 85
  commands:
    parameter_edit: 1
    generic_editor_message: 85
  parameter_edit_format: F0 18 0F <dev_id> 55 01 02 <param_lsb> <param_msb> <val_lsb> <val_msb> F7
ui_theme:
  style: hardware_chassis
  chassis_color: '#0f766e'
  panel_color: '#115e59'
  chassis_type: teal_world_expedition_rack
  knobs: black_knurled
  knob_color: '#18181b'
  knob_ring: '#14b8a6'
  buttons: tactile_black
  button_color: '#134e4a'
  button_text: '#ccfbf1'
  accent_color: '#2dd4bf'
  lcd_backlight: '#042f2e'
  lcd_text: '#2dd4bf'
parameters:
- id: filter_cutoff
  name: Z-Plane Filter Cutoff
  page: filter
  param_id: 384
  type: linear
  range: [0, 255]
  default: 205
- id: filter_resonance
  name: Filter Resonance
  page: filter
  param_id: 385
  type: linear
  range: [0, 15]
  default: 5
- id: amp_attack
  name: Amp Envelope Attack
  page: envelope
  param_id: 388
  type: linear
  range: [0, 127]
  default: 4
- id: amp_decay
  name: Amp Envelope Decay
  page: envelope
  param_id: 389
  type: linear
  range: [0, 127]
  default: 80
- id: amp_release
  name: Amp Envelope Release
  page: envelope
  param_id: 391
  type: linear
  range: [0, 127]
  default: 55
- id: ethnic_percussion_reverb
  name: World Reverb Send
  page: effects
  param_id: 412
  type: linear
  range: [0, 100]
  default: 35
- id: tuning_microtonal
  name: Microtonal Scale Tune
  page: tuning
  param_id: 430
  type: linear
  range: [0, 127]
  default: 0
