  style: vintage_hammond_b3_woodgrain
  cabinet_color: '#160b06'
  woodgrain_accent: '#3d1e11'
  drawbar_brown: '#8b4513'
  drawbar_white: '#f4f1ea'
  drawbar_black: '#1c1c1c'
  leslie_toggle_amber: '#f59e0b'
  lcd_backlight: '#21160a'
  lcd_text: '#ffb703'
