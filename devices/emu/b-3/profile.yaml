name: E-MU B-3
manufacturer: E-mu Systems, Inc.
category: 64-Voice Tonewheel Organ Synthesizer (Hammond & Leslie Modeling)
release_year: 2000
hardware:
  form_factor: 1U 19-inch Rackmount
  polyphony: 64
  multitimbral_parts: 16
  sound_memory: 32 MB Vintage Tonewheel Sample Set
  filters: 50 Z-Plane Multimode & Resonant Filters (up to 12-pole)
  effects: Dual 24-Bit Stereo DSP Processors (Leslie Rotary, Tube Distortion, Reverb,
    Chorus)
  drawbars: 9 Standard Harmonically-Coupled Drawbars
midi:
  manufacturer_id:
  - 24
  product_id: 15
  device_family:
  - 4
  - 4
  device_member:
  - 4
  - 0
  default_device_id: 0
  broadcast_device_id: 127
  bank_select:
    msb_cc: 0
    msb_val: 0
    lsb_cc: 32
    banks:
      0: User Bank 0 / B-3 Bank 0 (Organ w/ Rotor)
      1: User Bank 1 / B-3 Bank 1 (Direct Out)
      2: User Bank 2 / B-3 Bank 2 (Wildcards)
      3: User Bank 3 (User RAM)
sysex:
  header:
  - 240
  - 24
  - 15
  - '{device_id}'
  - 85
  commands:
    parameter_value_edit: 1
    parameter_value_request: 2
    preset_dump: 16
    master_settings_dump: 17
  parameter_edit_format:
    header:
    - 240
    - 24
    - 15
    - '{device_id}'
    - 85
    - 1
    - 2
    - '{param_lsb}'
    - '{param_msb}'
    - '{val_lsb}'
    - '{val_msb}'
    - 247
